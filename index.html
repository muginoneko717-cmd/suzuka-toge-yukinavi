<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国道1号 鈴鹿峠 雪ナビ</title><style>body{font-family:sans-serif;background:#f4f6f8;margin:0;color:#123047}header{background:#123047;color:white;padding:20px}main{max-width:600px;margin:auto;padding:12px}.card{background:white;border-radius:16px;padding:16px;margin:10px 0}a{display:block;background:#edf2f5;padding:12px;margin-top:8px;border-radius:10px;text-decoration:none;color:#123047;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#f7f9fa;padding:12px;border-radius:10px}.big{font-size:24px;font-weight:bold}</style></head><body><header><h1>国道1号 鈴鹿峠 雪ナビ</h1><div>亀山・関 ⇄ 甲賀・土山</div></header><main><div class="card"><b>実際の通行規制</b><div class="big">🚧 公式情報を確認</div><p>通行止め・チェーン規制は国土交通省の公式情報を優先してください。</p><a href="https://www.road-info-prvs.mlit.go.jp/roadinfo/pc/pcTop_00_0.html">国交省 道路情報</a><a href="https://www.cbr.mlit.go.jp/mie/live/list_road.php">鈴鹿峠 ライブカメラ</a></div><div class="card"><b>雪・凍結リスク</b><div id="risk" class="big">取得中…</div><div class="grid"><div class="metric">気温<div id="temp">--</div></div><div class="metric">降雪<div id="snow">--</div></div><div class="metric">積雪<div id="depth">--</div></div><div class="metric">風速<div id="wind">--</div></div></div><p>今後6時間の気象条件による試作判定です。</p></div><div class="card"><b>公式情報</b><a href="https://www.jma.go.jp/bosai/snow/">気象庁「今後の雪」</a><a href="https://www.jma.go.jp/bosai/forecast/">気象庁 天気予報</a></div></main><script>const u="https://api.open-meteo.com/v1/jma?latitude=34.89444&longitude=136.33801&current=temperature_2m,snowfall,snow_depth,wind_speed_10m&hourly=temperature_2m,snowfall,snow_depth&timezone=Asia%2FTokyo&forecast_hours=12";fetch(u).then(r=>r.json()).then(j=>{let c=j.current,h=j.hourly;temp.textContent=c.temperature_2m.toFixed(1)+"℃";snow.textContent=c.snowfall.toFixed(1)+"cm/h";depth.textContent=c.snow_depth.toFixed(1)+"cm";wind.textContent=c.wind_speed_10m.toFixed(1)+"km/h";let s=0;for(let i=0;i<6;i++){if(h.snowfall[i]>0)s++;if(h.snowfall[i]>=3)s+=2;if(h.snow_depth[i]>=3)s+=2;if(h.temperature_2m[i]<=0)s+=2}risk.textContent=s>=8?"🔴 非常に高い":s>=6?"🟠 高い":s>=3?"🟡 注意":"🟢 低い"}).catch(()=>risk.textContent="⚠️ 取得失敗")</script></body></html>
